default_install_hook_types:
- pre-commit
- prepare-commit-msg
- commit-msg
- pre-push
exclude: ^afterpython/_website/
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    stages:
    - pre-commit
  - id: end-of-file-fixer
    stages:
    - pre-commit
  - id: check-yaml
    stages:
    - pre-commit
  - id: check-toml
    stages:
    - pre-commit
  - id: check-added-large-files
    stages:
    - pre-commit
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.9
  hooks:
  - id: ruff-check
    stages:
    - pre-commit
    args:
    - --config
    - ./afterpython/ruff.toml
  - id: ruff-format
    stages:
    - pre-commit
    args:
    - --config
    - ./afterpython/ruff.toml
- repo: local
  hooks:
  # same id twice so that SKIP=ap-commit skips both
  - id: ap-commit
    name: commit message template
    entry: uv run --no-sync ap commit-msg --template
    language: system
    stages:
    - prepare-commit-msg
  - id: ap-commit
    name: check commit message
    entry: uv run --no-sync ap commit-msg
    language: system
    stages:
    - commit-msg
