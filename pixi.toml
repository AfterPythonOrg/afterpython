[workspace]
authors = ["softwareentrepreneer <softwareentrepreneer+afterpython@gmail.com>"]
channels = ["conda-forge"]
name = "afterpython"
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
# updating this needs to also update the version in the ci.yml and templates/ci-workflow-template.yml files
requires-pixi = ">=0.67.2"  # command: pixi workspace requires-pixi set ">=0.67.2"

[tasks]

[tasks.test-all]
depends-on = [
  { task = "test", environment = "py311" },
  { task = "test", environment = "py312" },
  { task = "test", environment = "py313" },
  # { task = "test", environment = "py314" },
]

[dependencies]
python = ">=3.11.14"
uv = ">=0.11.8"
gh = ">=2.92.0"

# `pixi config set pinning-strategy latest-up` removes the upper bound on the versions of the dependencies
[pypi-dependencies]
click = ">=8.2.1"
trogon = ">=0.6.0"
httpx = ">=0.28.1"
tomlkit = ">=0.14.0"
ruamel-yaml = ">=0.19.1"
gitpython = ">=3.1.49"
# pygithub = ">=2.8.1"
python-dotenv = ">=1.2.2"
pyproject-metadata = ">=0.11.0"
# jupytext = ">=1.18.1"
# jinja2 = ">=3.1.6"
mystmd = ">=1.9.0"
great-docs = ">=0.9"
ruff = ">=0.15.12"
pre-commit = ">=4.6.0"
commitizen = ">=4.13.10"
# python-semantic-release = ">=10.5.2"

# [pypi-options.dependency-overrides]
# platformdirs = ">=4.5.0"
# nodeenv = ">=1.9.1"

[environments]
default = ["py311", "dev", "optional"]
py311 = ["py311", "test", "optional"]
py312 = ["py312", "test", "optional"]
py313 = ["py313", "test", "optional"]
py314 = ["py314", "test", "optional"]

[feature.optional.pypi-dependencies]

[feature.dev.pypi-dependencies]
afterpython = { path = ".", editable = true }
notebook = ">=7.5.6"

[feature.test.pypi-dependencies]
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-mock = ">=3.15.1"
pytest-xdist = ">=3.8.0"
[feature.test.tasks]
test = "pytest -v -n auto"


[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"
