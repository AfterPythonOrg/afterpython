[project]
name = "afterpython"
version = "0.3.10"
description = "CLI tool to streamline Python package maintenance and generate a dedicated project website"
license = "Apache-2.0"
authors = [
    { name = "Stephen Yau", email = "softwareentrepreneer+afterpython@gmail.com" },
]
readme = "README.md"
keywords = [
    "package-maintenance",
    "project-website",
    "static-site-generator",
    "developer-tools",
    "documentation",
    "cli-tool",
    "ci/cd",
    "mystmd",
    "semantic-release",
    "python-packaging",
]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.2.1",
    "trogon>=0.6.0",
    "httpx>=0.28.1",
    "tomlkit>=0.15.0",
    "ruamel-yaml>=0.19.1",
    "gitpython>=3.1.50",
    # "pygithub>=2.8.1",
    "python-dotenv>=1.2.2",
    "pyproject-metadata>=0.11.0",
    "jupytext>=1.19.2",
    # "jinja2>=3.1.6",
    "mystmd>=1.9.0",
    "pdoc>=16.0.0",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
    "commitizen>=4.16.0",
    # "python-semantic-release>=10.5.2",
]

[project.urls]
homepage = "https://afterpython.afterpython.org"
repository = "https://github.com/AfterPythonOrg/afterpython"
documentation = "https://afterpython.afterpython.org/doc"

[project.scripts]
ap = "afterpython.main:run_cli"
pcu = "afterpython.main:run_pcu"

# [tool.uv]
# override-dependencies = ["platformdirs>=4.5.0", "nodeenv>=1.9.1"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "afterpython"
module-root = "src"

# [tool.uv.sources]
# afterpython = { path = ".", editable = true }

[tool.pyright]
typeCheckingMode = "basic"
