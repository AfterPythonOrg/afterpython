[project]
name = "afterpython"
version = "0.4.0"
description = "CLI tool to streamline Python package maintenance and generate a dedicated project website"
license = "Apache-2.0"
authors = [
    { name = "Stephen Yau", email = "softwareentrepreneer+afterpython@gmail.com" },
]
readme = "README.md"
keywords = [
    "package-maintenance",
    "project-website",
    "static-site-generator",
    "developer-tools",
    "documentation",
    "cli-tool",
    "ci/cd",
    "mystmd",
    "semantic-release",
    "python-packaging",
]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.1",
    "trogon>=0.6.0",
    "httpx2>=2.16.0",
    "tomlkit>=0.15.2",
    "ruamel-yaml>=0.19.1",
    "gitpython>=3.2.1",
    "python-dotenv>=1.2.4",
    "pyproject-metadata>=0.12.1",
    "jupytext>=1.19.6",
    "mystmd>=1.12.0",
    "pdoc>=16.0.0",
    "ruff>=0.17.4",
    "prek>=0.5.10",
    "ty>=0.0.99",
    "git-cliff>=2.14.2",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
marimo = ["marimo[recommended,lsp]>=0.25.2"]

[project.urls]
homepage = "https://afterpython.afterpython.org"
repository = "https://github.com/AfterPythonOrg/afterpython"
documentation = "https://afterpython.afterpython.org/doc"

[project.scripts]
ap = "afterpython.main:run_cli"
pcu = "afterpython.main:run_pcu"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# exclude-newer = "14 days"

[tool.uv.build-backend]
module-name = "afterpython"
module-root = "src"

[tool.ruff]
extend = "afterpython/ruff.toml"
